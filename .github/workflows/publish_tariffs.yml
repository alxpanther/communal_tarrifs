name: Publish Tariffs

# Publishes the tariff files that are already in the repository, without collecting anything.
#
# Why this exists separately from "Fetch and Update Tariffs": that workflow reads every source
# and asks a model to extract every tariff, which costs tokens and takes minutes. When the files
# themselves are already correct — a fix pushed by hand, a source list corrected and re-run
# locally, a revert — re-running collection to publish them is pure waste. This one just uploads
# what the commit contains.
#
# The automatic commit from the collecting workflow carries [skip ci], so it never triggers this
# one: that workflow deploys on its own and a second deployment of the same files would be a
# no-op at best and a race at worst.

on:
  push:
    branches:
      - main
    paths:
      # The published files, and only them. A change to code, config or documentation does not
      # publish anything — those reach users only through a collection run.
      - 'docs/tariffs_*.json'
      - 'dist/cloudflare/tariffs_index.json'
      # Bundled into the Android app rather than served, but a change here always accompanies a
      # change to the served copy, and listing it makes the intent obvious.
      - 'assets/tariffs_*_default.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shares the group with the collecting workflow: the two must never deploy Pages at once.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Deploy Tariff Files and Index to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Same layout as the collecting workflow: <cc>/tariffs_<cc>.json plus the index at the
          # bucket root, with country list and paths read from the index, never written here.
          wrangler r2 object put kommeter/tariffs_index.json \
            --file=dist/cloudflare/tariffs_index.json --remote
          python - <<'PY' > r2_uploads.txt
          import json
          index = json.load(open("dist/cloudflare/tariffs_index.json"))
          for entry in index["countries"]:
              code = entry["country"].lower()
              print(f"{entry['path']}\tdocs/tariffs_{code}.json")
          PY
          while IFS=$'\t' read -r key source; do
            echo "Uploading $source -> kommeter/$key"
            wrangler r2 object put "kommeter/$key" --file="$source" --remote
          done < r2_uploads.txt
          rm -f r2_uploads.txt
          # A country retired in config/countries.json leaves the bucket too. Pages drops it by
          # itself — docs/ no longer carries the file — but an object left in R2 would go on
          # being served to every app that still has the previous index cached.
          python - <<'PY' > r2_deletes.txt
          import json
          registry = json.load(open("config/countries.json"))
          template = registry["publication"]["cloudflare"]["path_template"]
          for entry in registry["countries"]:
              if entry.get("retired"):
                  print(template.format(cc=entry["code"].lower()))
          PY
          while read -r key; do
            [ -n "$key" ] || continue
            echo "Deleting retired kommeter/$key"
            wrangler r2 object delete "kommeter/$key" --remote || echo "  (already gone)"
          done < r2_deletes.txt
          rm -f r2_deletes.txt

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
