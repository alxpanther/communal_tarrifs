services:
  tariffs-fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kommeter_tariffs_fetcher
    env_file:
      - .env
    volumes:
      - ./assets:/app/assets
      - ./docs:/app/docs
      - ./config:/app/config
      - ./dist:/app/dist
    networks:
      - deploy
    # Countries to collect: COUNTRIES="ua am" in the shell or in .env, or arguments to
    # `docker compose run --rm tariffs-fetcher ua am`. Empty means every enabled country.
    command: ${COUNTRIES:-all}

  tariffs-deploy:
    build:
      context: .
      dockerfile: Dockerfile.wrangler
    image: deploy-tariffs
    container_name: deploy-tariffs
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - ./:/workspace
    networks:
      - deploy
    environment:
      COUNTRIES: ${COUNTRIES:-all}
    # Uploads the country index and the tariff files to the Cloudflare R2 bucket "kommeter".
    # The country list and the R2 paths come from the generated index, never from this file;
    # COUNTRIES narrows the upload to those countries, the index is uploaded every time.
    command:
      - sh
      - -c
      - |
        set -e
        wrangler r2 object put kommeter/tariffs_index.json --file=dist/cloudflare/tariffs_index.json --remote
        node -e '
          const wanted = (process.env.COUNTRIES || "all").toLowerCase().split(/\s+/).filter(Boolean);
          const index = require("./dist/cloudflare/tariffs_index.json");
          for (const entry of index.countries) {
            const code = entry.country.toLowerCase();
            if (wanted.includes("all") || wanted.includes(code)) {
              console.log(entry.path + " docs/tariffs_" + code + ".json");
            }
          }
        ' | while read -r key source; do
          echo "Uploading $$source -> kommeter/$$key"
          wrangler r2 object put "kommeter/$$key" --file="$$source" --remote || exit 1
        done

networks:
  deploy:
    name: deploy
