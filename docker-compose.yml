services:
  tariffs-fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kommeter_tariffs_fetcher
    env_file:
      - .env
    volumes:
      - ./assets:/app/assets
      - ./docs:/app/docs
      - ./config:/app/config
      - ./dist:/app/dist
    networks:
      - deploy

  tariffs-deploy:
    build:
      context: .
      dockerfile: Dockerfile.wrangler
    image: deploy-tariffs
    container_name: deploy-tariffs
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - ./:/workspace
    networks:
      - deploy
    # Загрузка файлов тарифов и индекса стран в облачный Cloudflare R2 бакет "kommeter".
    # Раскладка на R2: <код>/tariffs_<код>.json, индекс — в корне бакета.
    command: >
      sh -c "wrangler r2 object put kommeter/tariffs_index.json --file=dist/cloudflare/tariffs_index.json --remote &&
             wrangler r2 object put kommeter/ua/tariffs_ua.json --file=docs/tariffs_ua.json --remote &&
             wrangler r2 object put kommeter/am/tariffs_am.json --file=docs/tariffs_am.json --remote &&
             wrangler r2 object put kommeter/az/tariffs_az.json --file=docs/tariffs_az.json --remote"

networks:
  deploy:
    name: deploy
