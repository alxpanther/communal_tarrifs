services:
  tariffs-fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ukraine_tariffs_fetcher
    env_file:
      - .env
    volumes:
      # Mount outputs & configs so generated JSON files persist on host filesystem
      - ./assets:/app/assets
      - ./docs:/app/docs
      - ./config:/app/config
    networks:
      - deploy

  tariffs-deploy:
    build:
      context: .
      dockerfile: Dockerfile.wrangler
    image: deploy-tariffs
    container_name: deploy-tariffs
    working_dir: /workspace
    env_file:
      - .env
#    environment:
#      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
#      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./:/workspace
    networks:
      - deploy
    command: >
      sh -c "wrangler deploy --compatibility-date 2026-07-30"

networks:
  deploy:
    name: deploy
