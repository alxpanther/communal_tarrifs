services:
  tariffs-fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ukraine_tariffs_fetcher
    env_file:
      - .env
    volumes:
      - ./assets:/app/assets
      - ./docs:/app/docs
      - ./config:/app/config
    networks:
      - deploy

  tariffs-deploy:
    build:
      context: .
      dockerfile: Dockerfile.wrangler
    image: deploy-tariffs
    container_name: deploy-tariffs
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - ./:/workspace
    networks:
      - deploy
    # Загрузка файла tariffs.json напрямую в твой облачный Cloudflare R2 бакет "kommeter"
    command: >
      sh -c "wrangler r2 object put kommeter/ua/tariffs.json --file=docs/tariffs.json --remote"

networks:
  deploy:
    name: deploy
